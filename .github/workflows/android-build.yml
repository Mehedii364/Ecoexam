name: Android Build & APK Generation

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'APK_DOWNLOAD/**'
      - '.build-outputs/**'
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Real Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Verify Gradle Setup
        run: ./gradlew --version

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and Validate Generated APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Real APK file was not found at expected path: $APK_PATH"
            exit 1
          fi

          mkdir -p .build-outputs
          mkdir -p APK_DOWNLOAD

          cp "$APK_PATH" .build-outputs/app-debug.apk
          cp "$APK_PATH" APK_DOWNLOAD/app-debug.apk

          echo "=== 1. File Listing ==="
          ls -lh APK_DOWNLOAD/app-debug.apk

          echo "=== 2. File Type Inspection ==="
          file APK_DOWNLOAD/app-debug.apk

          echo "=== 3. APK Size Verification ==="
          APK_SIZE=$(stat -c%s APK_DOWNLOAD/app-debug.apk)
          echo "APK Size in bytes: $APK_SIZE"
          if [ "$APK_SIZE" -lt 500000 ]; then
            echo "ERROR: APK size ($APK_SIZE bytes) is suspiciously small. Aborting."
            exit 1
          fi

          echo "=== 4. APK ZIP Structure & Manifest Integrity ==="
          unzip -t APK_DOWNLOAD/app-debug.apk

          echo "=== 5. SHA256 Verification between copies ==="
          HASH_OUTPUT=$(sha256sum .build-outputs/app-debug.apk | awk '{print $1}')
          HASH_DOWNLOAD=$(sha256sum APK_DOWNLOAD/app-debug.apk | awk '{print $1}')
          echo "Hash (.build-outputs): $HASH_OUTPUT"
          echo "Hash (APK_DOWNLOAD):  $HASH_DOWNLOAD"

          if [ "$HASH_OUTPUT" != "$HASH_DOWNLOAD" ]; then
            echo "ERROR: SHA256 hashes do not match between build-outputs and APK_DOWNLOAD!"
            exit 1
          fi

          echo "=== APK VALIDATION SUCCESSFUL ==="
          echo "REAL DEBUG APK GENERATED AND VALIDATED: $APK_SIZE bytes, SHA256: $HASH_DOWNLOAD"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: APK_DOWNLOAD/app-debug.apk
          retention-days: 30

      - name: Commit and Push APK to GitHub Code Browser
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .build-outputs/app-debug.apk
          git add APK_DOWNLOAD/app-debug.apk

          if git diff --cached --quiet; then
            echo "No changes to commit in APK_DOWNLOAD"
          else
            git commit -m "build: update real debug APK from GitHub Actions [skip ci]"
            git push origin ${{ github.ref_name }}
          fi
